<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏡 國內旅行清單</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf6f0;
    --paper: #f4ede3;
    --warm-white: #fffcf7;
    --brown: #3d2b1f;
    --brown-mid: #6b4c35;
    --brown-light: #a87c5f;
    --brown-faint: #e8d9cc;
    --accent-orange: #d4734a;
    --accent-green: #5a8a65;
    --accent-blue: #4a6fa5;
    --ski-purple: #7b5ea7;
    --dive-teal: #2e8b80;
    --check1: #d4734a;
    --check2: #5a8a65;
    --shadow: rgba(61,43,31,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    background-image: 
      radial-gradient(ellipse at 20% 10%, rgba(212,115,74,0.07) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(90,138,101,0.07) 0%, transparent 50%);
    font-family: 'Noto Serif TC', serif;
    color: var(--brown);
    min-height: 100vh;
    padding: 0 0 60px;
  }

  .header {
    background: #f2a86c;
    color: var(--cream);
    padding: 28px 24px 22px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -30px; left: -30px; right: -30px; bottom: -30px;
    background: repeating-linear-gradient(
      45deg,
      transparent,
      transparent 20px,
      rgba(255,255,255,0.02) 20px,
      rgba(255,255,255,0.02) 21px
    );
  }
  .header-emoji {
    font-size: 2.2rem;
    display: block;
    margin-bottom: 6px;
    position: relative;
  }
  .header h1 {
    font-family: 'Noto Sans TC', 'Noto Serif TC', sans-serif;
    font-size: 2rem;
    font-weight: 500;
    letter-spacing: 0.03em;
    position: relative;
  }
  .header p {
    font-size: 0.78rem;
    opacity: 0.65;
    margin-top: 4px;
    letter-spacing: 0.05em;
    position: relative;
  }

  .page-links {
    padding: 12px 16px 0;
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .page-links .btn-reset:active {
    background: var(--accent-orange);
    border-color: var(--accent-orange);
    color: var(--cream);
  }
  .page-links .toggle-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 20px;
    border: 2px solid;
    background: transparent;
    cursor: pointer;
    font-family: 'Noto Serif TC', serif;
    font-size: 0.8rem;
    font-weight: 600;
    transition: all 0.25s ease;
    letter-spacing: 0.03em;
  }
  .page-links .toggle-btn.dive {
    border-color: var(--dive-teal);
    color: var(--dive-teal);
  }
  .page-links .toggle-btn.dive:hover,
  .page-links .toggle-btn.dive.active,
  .page-links .toggle-btn.dive:active {
    background: rgba(46,139,128,0.14);
    color: var(--dive-teal);
  }
  .page-links .toggle-btn.custom {
    border-color: var(--accent-blue);
    color: var(--accent-blue);
  }
  .page-links .toggle-btn.custom:hover,
  .page-links .toggle-btn.custom:active {
    background: rgba(74,111,165,0.14);
    color: var(--accent-blue);
  }
  .page-links .toggle-btn:active {
    transform: scale(0.98);
  }

  .legend {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 10px 20px;
    background: var(--paper);
    border-bottom: 1px solid var(--brown-faint);
    font-size: 0.72rem;
    color: var(--brown-mid);
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-dot {
    width: 14px; height: 14px;
    border-radius: 3px;
    border: 2px solid;
  }
  .legend-dot.c1 { border-color: var(--check1); background: transparent; }
  .legend-dot.c1.filled { background: var(--check1); }
  .legend-dot.c2 { border-color: var(--check2); background: transparent; }
  .legend-dot.c2.filled { background: var(--check2); }

  .toggles {
    display: none;
  }

  .progress-bar-wrap {
    padding: 10px 20px 0;
    background: var(--warm-white);
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    color: var(--brown-light);
    margin-bottom: 5px;
  }
  .progress-bar {
    height: 5px;
    background: var(--brown-faint);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--check1), var(--check2));
    border-radius: 99px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .section {
    margin: 16px 16px 0;
    background: var(--warm-white);
    border-radius: 14px;
    box-shadow: 0 2px 10px var(--shadow);
    overflow: hidden;
    border: 1px solid var(--brown-faint);
  }
  .section.optional {
    display: none;
  }
  .section.optional.visible {
    display: block;
  }
  .section-header {
    padding: 12px 16px;
    background: var(--paper);
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--brown-faint);
    cursor: pointer;
    user-select: none;
  }
  .section-header.dive-header { background: #e8f5f3; border-bottom-color: #c2deda; }
  .section-header.custom-header { background: #e8eef7; border-bottom-color: #cdd9ec; }
  .section-chevron {
    font-size: 0.7rem;
    color: var(--brown-light);
    transition: transform 0.2s;
  }
  .section.collapsed .section-chevron { transform: rotate(-90deg); }
  .section.collapsed .items-list { display: none; }
  .section-icon { font-size: 1.1rem; }
  .section-title {
    font-size: 0.88rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    flex: 1;
  }
  .section-count {
    font-size: 0.7rem;
    color: var(--brown-light);
    background: var(--brown-faint);
    padding: 2px 8px;
    border-radius: 10px;
  }
  .items-list { padding: 4px 0 8px; }
  .col-headers {
    display: grid;
    grid-template-columns: 1fr 32px 32px 28px;
    gap: 4px;
    padding: 4px 14px 4px;
    font-size: 0.64rem;
    color: var(--brown-light);
    letter-spacing: 0.06em;
    text-align: center;
    border-bottom: 1px dashed var(--brown-faint);
    margin-bottom: 2px;
  }
  .col-headers span:first-child { text-align: left; }

  .item {
    display: grid;
    grid-template-columns: 1fr 32px 32px 28px;
    align-items: center;
    gap: 4px;
    padding: 5px 14px;
    transition: background 0.15s;
  }
  .item:hover { background: rgba(61,43,31,0.03); }
  .section.dive-section .item:hover { background: rgba(46,139,128,0.06); }
  .section.dive-section .section-header:hover { background: #ddf0ed; }
  .section.custom-section .item:hover { background: rgba(74,111,165,0.06); }
  .section.custom-section .section-header:hover { background: #dde6f4; }
  .item.checked-both { opacity: 0.45; }

  .item-label {
    font-size: 0.82rem;
    line-height: 1.3;
    color: var(--brown);
    padding-right: 4px;
  }
  .item.checked-both .item-label {
    text-decoration: line-through;
    color: var(--brown-light);
  }

  .check-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .check-box {
    width: 22px; height: 22px;
    border-radius: 5px;
    border: 2px solid;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.18s ease;
    flex-shrink: 0;
    font-size: 0.75rem;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .check-box.c1 {
    border-color: var(--check1);
    color: white;
  }
  .check-box.c1.checked {
    background: var(--check1);
    border-color: var(--check1);
  }
  .check-box.c1.checked::after { content: '✓'; }
  .check-box.c2 {
    border-color: var(--check2);
    color: white;
  }
  .check-box.c2.checked {
    background: var(--check2);
    border-color: var(--check2);
  }
  .check-box.c2.checked::after { content: '✓'; }

  .del-btn {
    width: 22px; height: 22px;
    border: none;
    border-radius: 5px;
    background: transparent;
    color: var(--brown-light);
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .del-btn:hover {
    background: var(--accent-orange);
    color: var(--cream);
  }

  .footer-actions {
    padding: 20px 16px 0;
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn-reset {
    padding: 10px 22px;
    border-radius: 20px;
    border: 2px solid var(--brown-light);
    background: transparent;
    color: var(--brown-mid);
    font-family: 'Noto Serif TC', serif;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }
  .btn-reset:hover {
    background: var(--accent-orange);
    border-color: var(--accent-orange);
    color: var(--cream);
  }

  .sub-label {
    font-size: 0.67rem;
    color: var(--brown-light);
    letter-spacing: 0.08em;
    padding: 7px 14px 2px;
    text-transform: uppercase;
    opacity: 0.7;
  }

  .note-text {
    font-size: 0.72rem;
    color: var(--brown-light);
    text-align: center;
    padding: 16px 20px 0;
    font-style: italic;
    line-height: 1.6;
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(61,43,31,0.4);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal-box {
    background: var(--warm-white);
    border-radius: 14px;
    padding: 20px;
    width: min(320px, 100%);
    box-shadow: 0 8px 30px var(--shadow);
  }
  .modal-box h3 {
    font-size: 1rem;
    font-weight: 700;
    color: var(--brown);
    margin-bottom: 4px;
  }
  .modal-box label {
    display: block;
    font-size: 0.7rem;
    color: var(--brown-light);
    letter-spacing: 0.05em;
    margin: 14px 0 5px;
  }
  .modal-box select,
  .modal-box input {
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--brown-faint);
    font-family: 'Noto Serif TC', serif;
    font-size: 0.85rem;
    background: var(--cream);
    color: var(--brown);
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }
  .modal-actions .btn-reset {
    padding: 9px 20px;
    font-size: 0.78rem;
  }
  .modal-actions .btn-confirm {
    border-color: var(--accent-blue);
    color: var(--accent-blue);
  }
  .modal-actions .btn-confirm:hover {
    background: var(--accent-blue);
    border-color: var(--accent-blue);
    color: var(--cream);
  }
</style>
</head>
<body>

<div class="header">
  <span class="header-emoji">🏡</span>
  <h1>國內旅行清單</h1>
  <p>專屬國內旅行的獨立打包頁面</p>
</div>

<div class="page-links">
  <a class="btn-reset" href="index.html">← 回主清單</a>
  <button class="toggle-btn dive" id="toggleDive" onclick="toggleSection('dive')">
    <span class="toggle-icon">🤿</span> 加入潛水項目
  </button>
  <button class="toggle-btn custom" id="addItemBtn" onclick="openAddItemModal()">
    <span class="toggle-icon">➕</span> 新增物品
  </button>
</div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-dot c1"></div>
    <span>第一次檢查（打包時）</span>
  </div>
  <div class="legend-item">
    <div class="legend-dot c1 filled"></div>
    <div class="legend-dot c2 filled"></div>
    <span>第二次確認（出門前）</span>
  </div>
</div>

<div class="progress-bar-wrap">
  <div class="progress-info">
    <span>完成進度</span>
    <span id="progressText">0 / 0</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</div>

<div id="checklistContainer"></div>

<div class="footer-actions">
  <button class="btn-reset" onclick="resetAll()">🔄 全部重置</button>
  <button class="btn-reset" onclick="resetSection1()">清除第一次</button>
  <button class="btn-reset" onclick="resetSection2()">清除第二次</button>
</div>

<p class="note-text">國內旅行專用清單，出發前確認更安心。</p>

<div class="modal-overlay" id="addItemModal">
  <div class="modal-box">
    <h3>新增物品</h3>
    <label>選擇分類</label>
    <select id="newItemSection"></select>
    <label>物品名稱</label>
    <input type="text" id="newItemName" placeholder="輸入物品名稱">
    <div class="modal-actions">
      <button class="btn-reset" onclick="closeAddItemModal()">取消</button>
      <button class="btn-reset btn-confirm" onclick="confirmAddItem()">新增</button>
    </div>
  </div>
</div>

<script>
const SECTIONS = [
  {
    id: 'domestic',
    icon: '🏡',
    title: '國內旅行清單',
    optional: false,
    items: [
      '隨身包',
      '行動電源 + 充電線',
      '錢包',
      '信用卡',
      '身分證 + 健保卡',
      '現金',
      '手機繩',
      '太陽眼鏡',
      '耳機',
      '行李袋',
      '充電組（Type-C、Lightning、充電頭）',
      '化妝袋',
      '保養品袋（小白瓶、水楊酸、A醇、洗面乳）',
      '牙刷組',
      '舌苔刷 + 舌苔凝膠',
      '卸妝棉',
      '棉片',
      '梳子（捲梳）',
      '護唇膏',
      '護手霜',
      '噴劑',
      '小毛巾',
      '拖鞋',
      '眼罩',
      '耳塞 × 2',
      'EVE 退燒止痛藥',
      '化痰藥',
      '感冒藥（大正）',
      '過敏藥（鼻噴 + 口服）',
      '合力他命',
      '表飛鳴（腸胃）',
      '止瀉藥',
      '喉嚨痛舒緩藥',
      '液態 OK 繃',
      '暈車藥',
      '每日換洗衣服（數量依天數）',
      '外套',
      '內衣 / 內褲',
      '免洗褲',
      '襪子',
      '睡衣睡褲',
      '衛生棉',
      '防曬外套',
      '帽子',
      '牙線棒',
    ]
  },
  {
    id: 'dive',
    icon: '🤿',
    title: '潛水裝備',
    optional: true,
    optionalType: 'dive',
    headerClass: 'dive-header',
    items: [
      '泳衣',
      '泳帽',
      '面鏡',
      '呼吸管',
      '蛙鞋',
      '防寒衣 / 潛水衣',
      '手套',
      '除霧劑',
      '防曬潛水套',
    ]
  },
];

const LS_STATE   = 'domestic_packlist_state_v1';
const LS_DIVE    = 'domestic_packlist_dive_v1';
const LS_CUSTOM  = 'domestic_packlist_custom_v1';
const LS_REMOVED = 'domestic_packlist_removed_v1';

let state        = JSON.parse(localStorage.getItem(LS_STATE) || '{}');
let showDive     = localStorage.getItem(LS_DIVE) === 'true';
let customRaw    = JSON.parse(localStorage.getItem(LS_CUSTOM) || '{}');
let customItems  = Array.isArray(customRaw) ? {} : customRaw;
let removedItems = JSON.parse(localStorage.getItem(LS_REMOVED) || '[]');

function saveState() {
  localStorage.setItem(LS_STATE, JSON.stringify(state));
}
function saveCustom() {
  localStorage.setItem(LS_CUSTOM, JSON.stringify(customItems));
}
function saveRemoved() {
  localStorage.setItem(LS_REMOVED, JSON.stringify(removedItems));
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function getSections() {
  const sections = SECTIONS.map(sec => {
    const items = [];
    sec.items.forEach((text, idx) => {
      const key = `${sec.id}_${idx}`;
      if (!removedItems.includes(key)) items.push({ text, key });
    });
    (customItems[sec.id] || []).forEach((text, idx) => {
      items.push({ text, key: `${sec.id}_custom_${idx}` });
    });
    return Object.assign({}, sec, { items });
  });

  const extraItems = (customItems['custom'] || []).map((text, idx) => ({ text, key: `custom_custom_${idx}` }));
  if (extraItems.length) {
    sections.unshift({
      id: 'custom',
      icon: '➕',
      title: '本次新增項目',
      optional: false,
      headerClass: 'custom-header',
      items: extraItems,
    });
  }
  return sections;
}

function openAddItemModal() {
  const select = document.getElementById('newItemSection');
  select.innerHTML = SECTIONS.map(sec => `<option value="${sec.id}">${sec.icon} ${sec.title}</option>`).join('')
    + `<option value="custom">➕ 本次新增項目</option>`;
  document.getElementById('newItemName').value = '';
  document.getElementById('addItemModal').classList.add('active');
  document.getElementById('newItemName').focus();
}

function closeAddItemModal() {
  document.getElementById('addItemModal').classList.remove('active');
}

function confirmAddItem() {
  const sectionId = document.getElementById('newItemSection').value;
  const name = document.getElementById('newItemName').value.trim();
  if (!name) return;
  if (!customItems[sectionId]) customItems[sectionId] = [];
  customItems[sectionId].push(name);
  saveCustom();
  closeAddItemModal();
  buildHTML();
  renderAll();
  updateProgress();
}

function removeItem(key) {
  if (!confirm('確定要刪除這個項目嗎？')) return;
  const m = key.match(/^(.+)_custom_(\d+)$/);
  if (m) {
    const sectionId = m[1];
    const idx = parseInt(m[2], 10);
    customItems[sectionId].splice(idx, 1);
    if (!customItems[sectionId].length) delete customItems[sectionId];
    saveCustom();
    const prefix = `${sectionId}_custom_`;
    const newState = {};
    Object.keys(state).forEach(k => {
      if (!k.startsWith(prefix)) { newState[k] = state[k]; return; }
      const i = parseInt(k.slice(prefix.length), 10);
      if (i < idx) newState[k] = state[k];
      else if (i > idx) newState[`${prefix}${i - 1}`] = state[k];
    });
    state = newState;
  } else {
    if (!removedItems.includes(key)) removedItems.push(key);
    saveRemoved();
    delete state[key];
  }
  saveState();
  buildHTML();
  renderAll();
  updateProgress();
}

function toggleSection(type) {
  if (type === 'dive') {
    showDive = !showDive;
    localStorage.setItem(LS_DIVE, showDive);
    document.getElementById('toggleDive').classList.toggle('active', showDive);
    document.querySelector('.section.dive-section').classList.toggle('visible', showDive);
  }
  updateProgress();
}

function toggleCollapse(sectionId) {
  const el = document.getElementById(`sec_${sectionId}`);
  el.classList.toggle('collapsed');
}

function toggle(key, col) {
  if (!state[key]) state[key] = { c1: false, c2: false };
  state[key][col] = !state[key][col];
  renderItem(key);
  updateProgress();
  saveState();
}

function renderItem(key) {
  const s = state[key] || { c1: false, c2: false };
  const c1el = document.getElementById(`c1_${key}`);
  const c2el = document.getElementById(`c2_${key}`);
  const row = document.getElementById(`row_${key}`);
  if (c1el) c1el.classList.toggle('checked', s.c1);
  if (c2el) c2el.classList.toggle('checked', s.c2);
  if (row) row.classList.toggle('checked-both', s.c1 && s.c2);
}

function updateProgress() {
  let total = 0, done = 0;
  getSections().forEach(sec => {
    const isVisible = !sec.optional || (sec.optionalType === 'dive' ? showDive : true);
    if (!isVisible) return;
    sec.items.forEach(item => {
      total++;
      const s = state[item.key] || {};
      if (s.c1 && s.c2) done++;
    });
  });
  document.getElementById('progressText').textContent = `${done} / ${total}`;
  const pct = total > 0 ? (done / total * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

function resetAll() {
  if (!confirm('確定要重置所有打勾嗎？')) return;
  state = {};
  saveState();
  renderAll();
  updateProgress();
}

function resetSection1() {
  Object.keys(state).forEach(k => { state[k].c1 = false; });
  saveState();
  renderAll();
  updateProgress();
}

function resetSection2() {
  Object.keys(state).forEach(k => { state[k].c2 = false; });
  saveState();
  renderAll();
  updateProgress();
}

function renderAll() {
  getSections().forEach(sec => {
    sec.items.forEach(item => renderItem(item.key));
  });
}

function buildHTML() {
  const container = document.getElementById('checklistContainer');
  let html = '';
  getSections().forEach(sec => {
    let secClass = 'section';
    if (sec.optional) {
      secClass += ' optional ' + sec.optionalType + '-section';
      const visible = sec.optionalType === 'dive' ? showDive : true;
      if (visible) secClass += ' visible';
    }
    if (sec.id === 'custom') secClass += ' custom-section';
    const headerClass = sec.headerClass || '';
    html += `<div class="${secClass}" id="sec_${sec.id}">`;
    html += `<div class="section-header ${headerClass}" onclick="toggleCollapse('${sec.id}')">`;
    html += `<span class="section-icon">${sec.icon}</span>`;
    html += `<span class="section-title">${sec.title}</span>`;
    html += `<span class="section-count">${sec.items.length} 項</span>`;
    html += `<span class="section-chevron">▼</span>`;
    html += `</div>`;
    html += `<div class="items-list">`;
    html += `<div class="col-headers"><span>項目</span><span>1st</span><span>2nd</span><span></span></div>`;
    sec.items.forEach(item => {
      const key = item.key;
      html += `<div class="item" id="row_${key}">`;
      html += `<span class="item-label">${escapeHtml(item.text)}</span>`;
      html += `<div class="check-wrap"><div class="check-box c1" id="c1_${key}" onclick="toggle('${key}','c1')"></div></div>`;
      html += `<div class="check-wrap"><div class="check-box c2" id="c2_${key}" onclick="toggle('${key}','c2')"></div></div>`;
      html += `<div class="check-wrap"><button class="del-btn" onclick="removeItem('${key}')">✕</button></div>`;
      html += `</div>`;
    });
    html += `</div></div>`;
  });
  container.innerHTML = html;
}

buildHTML();
if (showDive) {
  document.getElementById('toggleDive').classList.add('active');
}
renderAll();
updateProgress();
</script>
</body>
</html>
